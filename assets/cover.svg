<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="laya-guard cover">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0b1020"/>
  <circle cx="200" cy="120" r="320" fill="url(#glow1)"/>
  <circle cx="1150" cy="560" r="360" fill="url(#glow2)"/>
  <!-- logo mark -->
  <g transform="translate(120,170) scale(1.17)">
    <rect width="256" height="256" rx="56" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    <path d="M128 28 L196 60 V128 C196 180 164 214 128 232 C92 214 60 180 60 128 V60 Z"
          fill="url(#shield)"/>
    <circle cx="92" cy="140" r="17" fill="#22c55e" stroke="#ffffff" stroke-width="5"/>
    <circle cx="128" cy="140" r="17" fill="#f59e0b" stroke="#ffffff" stroke-width="5"/>
    <circle cx="164" cy="140" r="17" fill="#ef4444" stroke="#ffffff" stroke-width="5"/>
    <text x="128" y="196" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="30" font-weight="bold" fill="#ffffff">&gt;_</text>
  </g>
  <!-- wordmark -->
  <text x="480" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="104" font-weight="bold" fill="#ffffff">laya-guard</text>
  <text x="484" y="368" font-family="system-ui,-apple-system,sans-serif"
        font-size="38" fill="#94a3b8">every tool_call judged on your laptop. free.</text>
  <!-- verdict pills -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" font-weight="bold">
    <rect x="484" y="410" width="150" height="64" rx="32" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="559" y="453" text-anchor="middle" fill="#22c55e">allow</text>
    <rect x="654" y="410" width="170" height="64" rx="32" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <text x="739" y="453" text-anchor="middle" fill="#f59e0b">review</text>
    <rect x="844" y="410" width="150" height="64" rx="32" fill="none" stroke="#ef4444" stroke-width="3"/>
    <text x="919" y="453" text-anchor="middle" fill="#ef4444">block</text>
  </g>
</svg>
